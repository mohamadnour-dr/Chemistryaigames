/* ═══════════════════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════════════════ */
let gs      = 'start'; // start|intro|playing|levdone|gameover|win
let lvl     = 0;
let lives   = 3;
let score   = 0;
let lastPts = 0;
let mx = W/2, my = H/2;
let bullets    = [];
let particles  = [];
let floats     = [];
let hintOn     = false;
let lvlStartT  = 0;
let mol        = null;

/* gun */
let gunAngle = -Math.PI/2;
let gunFlash = 0;
const GX = W/2, GY = H - 30;
const BARREL = 54;

/* ═══════════════════════════════════════════════════════════
   MOLECULE CLASS
   ═══════════════════════════════════════════════════════════ */
class Mol {
  constructor(ld) {
    this.ld = ld;
    this.x  = W / 2;
    this.y  = H * 0.30;
    const s = ld.spd;
    this.vx = s * (Math.random() > 0.5 ? 1 : -1);
    this.vy = ld.ymot ? s * 0.38 * (Math.random() > 0.5 ? 1 : -1) : 0;
    this.flash     = new Map(); // atomIdx → {t, ok}
    this.hintPulse = 0;         // frames to highlight correct H after a wrong hit
    this.t = 0;
  }

  /* world position of atom i */
  ap(i) {
    const a = this.ld.atoms[i];
    return { x: this.x + a.rx, y: this.y + a.ry };
  }

  /* max horizontal radius including atom circles */
  ext() {
    return Math.max(...this.ld.atoms.map(a => Math.abs(a.rx))) + AR + 12;
  }

  update() {
    this.t++;
    this.x += this.vx;
    const ext = this.ext();
    if (this.x - ext < 8 || this.x + ext > W - 8) {
      this.vx *= -1;
      this.x = Math.max(ext + 8, Math.min(W - ext - 8, this.x));
    }
    if (this.ld.ymot) {
      this.y += this.vy;
      const yMin = 78, yMax = H * 0.56;
      if (this.y < yMin || this.y > yMax) {
        this.vy *= -1;
        this.y = Math.max(yMin, Math.min(yMax, this.y));
      }
    }
    this.flash.forEach((v, k) => { v.t--; if (v.t <= 0) this.flash.delete(k); });
    if (this.hintPulse > 0) this.hintPulse--;
  }

  draw() {
    const ld = this.ld;

    /* ── bonds ── */
    ld.bonds.forEach(b => {
      const p1 = this.ap(b.a), p2 = this.ap(b.b);
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len < 2) return;
      const ux = dx/len, uy = dy/len;
      g.strokeStyle = '#5577AA'; g.lineWidth = 2.2;
      if (b.t === 1) {
        g.beginPath();
        g.moveTo(p1.x + ux*AR, p1.y + uy*AR);
        g.lineTo(p2.x - ux*AR, p2.y - uy*AR);
        g.stroke();
      } else {
        /* double bond — two parallel lines */
        const nx = -uy * 4.5, ny = ux * 4.5;
        for (const sg of [1, -1]) {
          g.beginPath();
          g.moveTo(p1.x + ux*AR + nx*sg, p1.y + uy*AR + ny*sg);
          g.lineTo(p2.x - ux*AR + nx*sg, p2.y - uy*AR + ny*sg);
          g.stroke();
        }
      }
    });

    /* ── atoms ── */
    ld.atoms.forEach((a, i) => {
      const pos  = this.ap(i);
      const fl   = this.flash.get(i);
      const key  = a.s === 'Ha' ? 'Ha' : a.s; // 'Ha' = acidic H colour key
      const ec   = EC[key] || EC.H;

      let fill = ec.f, strk = ec.s, glow = null, blur = 0;

      if (fl) {
        /* flash on hit */
        fill = fl.ok ? '#00EE77' : '#DD1111';
        strk = fill; glow = fill; blur = 30;
      } else if (this.hintPulse > 0 && a.acidic) {
        /* hint pulse after wrong hit — highlight correct atoms */
        glow = '#FFD700';
        blur = 10 + 14 * (this.hintPulse / 90);
      }

      if (glow) { g.shadowColor = glow; g.shadowBlur = blur; }
      g.beginPath(); g.arc(pos.x, pos.y, AR, 0, Math.PI*2);
      g.fillStyle = fill; g.fill();
      g.strokeStyle = strk; g.lineWidth = 2.2; g.stroke();
      g.shadowBlur = 0;

      /* atom symbol */
      const sym = a.s === 'Ha' ? 'H' : a.s; // display acidic H as 'H'
      const fs  = sym.length > 2 ? 9 : sym.length > 1 ? 12 : 14;
      g.font = `bold ${fs}px monospace`;
      g.fillStyle = fl ? '#000' : ec.t;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(sym, pos.x, pos.y);
    });

    /* ── charge label ── */
    if (ld.charge) {
      const topA = ld.atoms.reduce((best, a) => a.ry < best.ry ? a : best);
      g.font = 'bold 15px monospace'; g.fillStyle = '#FFD700';
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillText(ld.charge, this.x + topA.rx + 20, this.y + topA.ry - 14);
    }

    /* ── name tag above molecule ── */
    const topY = Math.min(...ld.atoms.map(a => a.ry));
    g.font = 'bold 13px Segoe UI';
    g.fillStyle = ld.col + 'BB';
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillText(ld.name, this.x, this.y + topY - 28);
  }
}

/* ═══════════════════════════════════════════════════════════
   BULLET
   ═══════════════════════════════════════════════════════════ */
class Bullet {
  constructor(x, y, vx, vy) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.alive=true; this.trail=[];
  }
  update() {
    this.trail.unshift({x:this.x,y:this.y});
    if (this.trail.length > 10) this.trail.pop();
    this.x += this.vx; this.y += this.vy;
    if (this.x<-20||this.x>W+20||this.y<-20||this.y>H+20) this.alive=false;
  }
  draw() {
    this.trail.forEach((p,i) => {
      const f=(this.trail.length-i)/this.trail.length;
      g.beginPath(); g.arc(p.x,p.y,4.5*f,0,Math.PI*2);
      g.fillStyle=`rgba(255,200,50,${f*0.5})`; g.fill();
    });
    g.shadowColor='#FFDD00'; g.shadowBlur=16;
    g.beginPath(); g.arc(this.x,this.y,5.5,0,Math.PI*2);
    g.fillStyle='#FFE040'; g.fill();
    g.shadowBlur=0;
  }
}

/* ═══════════════════════════════════════════════════════════
   PARTICLE
   ═══════════════════════════════════════════════════════════ */
class Particle {
  constructor(x,y,col) {
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*12;
    this.vy=(Math.random()-0.5)*12-2;
    this.life=1;
    this.decay=0.014+Math.random()*0.028;
    this.r=2.5+Math.random()*5;
    this.col=col;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.2; this.life-=this.decay; }
  draw(){
    const h=Math.floor(this.life*255).toString(16).padStart(2,'0');
    g.beginPath(); g.arc(this.x,this.y,this.r*this.life,0,Math.PI*2);
    g.fillStyle=this.col+h; g.fill();
  }
}
function burst(n,x,y,col){ for(let i=0;i<n;i++) particles.push(new Particle(x,y,col)); }

/* ═══════════════════════════════════════════════════════════
   FLOATING TEXT
   ═══════════════════════════════════════════════════════════ */
class FTxt {
  constructor(x,y,txt,col,sz=20){
    this.x=x;this.y=y;this.txt=txt;this.col=col;this.sz=sz;
    this.life=1;this.vy=-1.8;
  }
  update(){ this.y+=this.vy; this.life-=0.016; }
  draw(){
    const h=Math.floor(this.life*255).toString(16).padStart(2,'0');
    g.font=`bold ${this.sz}px Segoe UI`;
    g.fillStyle=this.col+h;
    g.textAlign='center'; g.textBaseline='alphabetic';
    g.fillText(this.txt,this.x,this.y);
  }
}

/* ═══════════════════════════════════════════════════════════
   HIT DETECTION
   ═══════════════════════════════════════════════════════════ */
function checkHits() {
  bullets.forEach(b => {
    if (!b.alive) return;
    mol.ld.atoms.forEach((atom, i) => {
      const p = mol.ap(i);
      const dx = b.x-p.x, dy = b.y-p.y;
      if (dx*dx+dy*dy < (AR+8)*(AR+8)) {
        b.alive = false;

        if (atom.s !== 'H' && atom.s !== 'Ha') {
          /* hit a non-H atom — no life penalty, just feedback */
          burst(7,p.x,p.y,'#FFAA33');
          floats.push(new FTxt(p.x,p.y-40,'Not H!','#FFAA33',16));

        } else if (atom.acidic) {
          /* ✓ CORRECT hit */
          mol.flash.set(i,{t:60,ok:true});
          burst(50,p.x,p.y,'#00FF88');
          burst(25,p.x,p.y,'#FFFFFF');
          const elap   = (performance.now()-lvlStartT)/1000;
          const tBonus = Math.max(0, Math.round(150 - elap*2.2));
          const pts    = 100 + tBonus;
          score += pts; lastPts = pts;
          floats.push(new FTxt(p.x,p.y-52,`+${pts}`,'#44FF88',22));
          floats.push(new FTxt(W/2,H*0.62,
            `${mol.ld.name}  −H⁺→  ${mol.ld.cb}`,'#CCFFEE',17));
          gs = 'levdone';

        } else {
          /* ✗ WRONG H */
          mol.flash.set(i,{t:50,ok:false});
          burst(22,p.x,p.y,'#FF2222');
          mol.hintPulse = 90;   // flash correct H's for ~1.5 s
          floats.push(new FTxt(p.x,p.y-52,'Wrong H!','#FF4444',20));
          floats.push(new FTxt(p.x,p.y-30,`−1 Life`,'#FF8888',14));
          if (lives > 0) lives--;
          if (lives === 0) {
            gs = 'levdone';
            setTimeout(() => { if (gs==='levdone') gs='gameover'; }, 1100);
          }
        }
      }
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   DRAWING HELPERS
   ═══════════════════════════════════════════════════════════ */
function rrect(x,y,w,h,r) {
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y);
  g.arcTo(x+w,y,x+w,y+r,r); g.lineTo(x+w,y+h-r);
  g.arcTo(x+w,y+h,x+w-r,y+h,r); g.lineTo(x+r,y+h);
  g.arcTo(x,y+h,x,y+h-r,r); g.lineTo(x,y+r);
  g.arcTo(x,y,x+r,y,r); g.closePath();
}

function wrapLines(txt,maxW,fnt) {
  g.font=fnt;
  const words=txt.split(' '); const lines=[]; let cur='';
  words.forEach(w => {
    const t=cur?cur+' '+w:w;
    if (g.measureText(t).width>maxW&&cur) { lines.push(cur); cur=w; }
    else cur=t;
  });
  if (cur) lines.push(cur);
  return lines;
}

function drawBg() {
  g.fillStyle=BG; g.fillRect(0,0,W,H);
  /* subtle nebula */
  const nb=g.createRadialGradient(W*0.22,H*0.25,30,W*0.22,H*0.25,320);
  nb.addColorStop(0,'rgba(12,28,75,0.10)'); nb.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=nb; g.fillRect(0,0,W,H);
  /* stars */
  const t=Date.now()*0.0009;
  STARS.forEach(s => {
    const a=0.22+0.28*Math.sin(t+s.ph);
    g.beginPath(); g.arc(s.x,s.y,s.r,0,Math.PI*2);
    g.fillStyle=`rgba(255,255,255,${a})`; g.fill();
  });
}

function gunTip() {
  return { x:GX+Math.cos(gunAngle)*(BARREL+24), y:GY+Math.sin(gunAngle)*(BARREL+24) };
}

function drawAimLine() {
  const tip=gunTip();
  g.save();
  g.strokeStyle='rgba(80,130,200,0.14)';
  g.lineWidth=1.5; g.setLineDash([5,10]);
  g.beginPath(); g.moveTo(tip.x,tip.y);
  g.lineTo(tip.x+Math.cos(gunAngle)*2400, tip.y+Math.sin(gunAngle)*2400);
  g.stroke(); g.setLineDash([]); g.restore();
}

function drawGun() {
  g.save(); g.translate(GX,GY);
  /* base ring */
  g.beginPath(); g.arc(0,0,30,0,Math.PI*2);
  g.fillStyle='#07182e'; g.fill();
  g.strokeStyle='#1e4870'; g.lineWidth=2.5; g.stroke();
  /* inner ring decorations */
  for (let i=1;i<=2;i++){
    g.beginPath(); g.arc(0,0,8+i*9,0,Math.PI*2);
    g.strokeStyle=`rgba(50,110,180,${0.35-i*0.08})`; g.lineWidth=1; g.stroke();
  }
  /* barrel */
  g.rotate(gunAngle);
  g.fillStyle=gunFlash>0?'#FFDD44':'#122840';
  g.beginPath(); g.roundRect(20,-7,BARREL,14,3); g.fill();
  g.fillStyle='#1e4878'; g.beginPath(); g.roundRect(20,-7,14,14,3); g.fill();
  g.fillStyle='#5a9acc'; g.beginPath(); g.roundRect(BARREL+20-6,-5,14,10,2); g.fill();
  /* muzzle flash */
  if (gunFlash>0){
    const af=gunFlash/8;
    g.shadowColor='#FFE000'; g.shadowBlur=22;
    g.beginPath(); g.arc(BARREL+28,0,13*af,0,Math.PI*2);
    g.fillStyle=`rgba(255,225,50,${af})`; g.fill();
    g.shadowBlur=0;
  }
  g.restore();
  if (gunFlash>0) gunFlash--;
}

function drawCrosshair() {
  const sz=13, gap=5;
  g.strokeStyle='rgba(160,210,255,0.70)'; g.lineWidth=1.5;
  g.beginPath();
  g.moveTo(mx-sz,my); g.lineTo(mx-gap,my);
  g.moveTo(mx+gap,my); g.lineTo(mx+sz,my);
  g.moveTo(mx,my-sz); g.lineTo(mx,my-gap);
  g.moveTo(mx,my+gap); g.lineTo(mx,my+sz);
  g.stroke();
  g.beginPath(); g.arc(mx,my,2.5,0,Math.PI*2);
  g.fillStyle='rgba(160,210,255,0.55)'; g.fill();
}

/* ═══════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════ */
function loop() {
  requestAnimationFrame(loop);

  if (gs==='start')    { drawStart();   return; }
  if (gs==='intro')    { drawIntro();   return; }
  if (gs==='gameover') { drawGameOver();return; }
  if (gs==='win')      { drawWin();     return; }

  if (gs==='levdone') {
    drawBg(); drawAimLine();
    drawLevelDone();
    return;
  }

  /* gs === 'playing' */
  drawBg();
  drawAimLine();

  /* update */
  mol.update();
  bullets.forEach(b=>b.update()); bullets=bullets.filter(b=>b.alive);
  particles.forEach(p=>p.update()); particles=particles.filter(p=>p.life>0);
  floats.forEach(f=>f.update()); floats=floats.filter(f=>f.life>0);

  checkHits();

  /* draw scene */
  particles.forEach(p=>p.draw());
  mol.draw();
  bullets.forEach(b=>b.draw());
  floats.forEach(f=>f.draw());

  gunAngle=Math.atan2(my-GY,mx-GX);
  drawGun(); drawHUD(); drawHintBox(); drawCrosshair();
}

/* ═══════════════════════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════════════════════ */
cv.addEventListener('mousemove', e => {
  const r=cv.getBoundingClientRect();
  mx=(e.clientX-r.left)*(W/r.width);
  my=(e.clientY-r.top)*(H/r.height);
});

cv.addEventListener('click', e => {
  const r=cv.getBoundingClientRect();
  const cx2=(e.clientX-r.left)*(W/r.width);
  const cy2=(e.clientY-r.top)*(H/r.height);

  if (gs==='start') {
    const b=window._SB;
    if (b&&cx2>=b.x&&cx2<=b.x+b.w&&cy2>=b.y&&cy2<=b.y+b.h) gs='intro';
    return;
  }
  if (gs==='intro') {
    mol=new Mol(LEVELS[lvl]);
    bullets=[]; particles=[]; floats=[]; hintOn=false;
    lvlStartT=performance.now();
    gs='playing'; return;
  }
  if (gs==='levdone' && lives>0) {
    lvl++;
    gs = lvl >= LEVELS.length ? 'win' : 'intro';
    return;
  }
  if (gs==='gameover'||gs==='win') {    lvl=0; lives=3; score=0; lastPts=0; gs='start'; return;
  }
  if (gs==='playing') {
    const tip=gunTip();
    bullets.push(new Bullet(tip.x,tip.y,
      Math.cos(gunAngle)*BSPD, Math.sin(gunAngle)*BSPD));
    gunFlash=8;
  }
});

document.addEventListener('keydown', e => {
  if (e.key.toLowerCase()==='h') hintOn=!hintOn;
});

/* kick off */
loop();
</script>
</body>
</html>
