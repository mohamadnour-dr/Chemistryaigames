/* shrink font until text fits maxW */
function fitFont(txt, px, maxW, bold, fam) {
  const mk = s => (bold ? 'bold ' : '') + s + 'px ' + (fam || FF);
  let s = px; g.font = mk(s);
  while (s > 7 && g.measureText(txt).width > maxW) { s -= 0.5; g.font = mk(s); }
  return s;
}
