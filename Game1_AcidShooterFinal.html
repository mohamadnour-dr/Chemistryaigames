const isTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

/* shrink font until text fits maxW */
function fitFont(txt, px, maxW, bold, fam) {
  const mk = s => (bold ? 'bold ' : '') + s + 'px ' + (fam || FF);
  let s = px; g.font = mk(s);
  while (s > 7 && g.measureText(txt).width > maxW) { s -= 0.5; g.font = mk(s); }
  return s;
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE SIZING
   Logical canvas is at least 480×540; on smaller phones the
   whole canvas is scaled down to fit. Portrait gets a tall layout.
   ═══════════════════════════════════════════════════════════ */
function resize() {
  const vw = wrap.clientWidth  || window.innerWidth;
  const vh = wrap.clientHeight || window.innerHeight;
  const s  = Math.min(1, vw/480, vh/540);
  let lw = Math.min(vw/s, 920);
  let lh = vh/s;
  lh = Math.min(lh, lw >= lh ? 648 : 1000);
  W = Math.floor(lw); H = Math.floor(lh);

  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width  = (W*s) + 'px';
  cv.style.height = (H*s) + 'px';
  cv.width  = Math.round(W*s*dpr);
  cv.height = Math.round(H*s*dpr);
  g.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);

  narrow = W < 760;
  hudH   = narrow ? 96 : 68;
  GX = W/2; GY = H - 30;
  makeStars();
  if (mol) mol.fit();
}

/* ═══════════════════════════════════════════════════════════
   MOLECULE CLASS
   ═══════════════════════════════════════════════════════════ */
class Mol {
  constructor(ld) {
    this.ld = ld;
    const xs = ld.atoms.map(a => a.rx), ys = ld.atoms.map(a => a.ry);
    this.x0 = Math.min(...xs) - AR - 12;  this.x1 = Math.max(...xs) + AR + 12;
    this.y0 = Math.min(...ys) - AR - 34;  this.y1 = Math.max(...ys) + AR;   // includes name tag
    this.x  = W/2 - (this.x0 + this.x1)/2;
    this.y  = H * 0.30;
    const s = ld.spd;
    this.vx = s * (Math.random() > 0.5 ? 1 : -1);
    this.vy = ld.ymot ? s * 0.38 * (Math.random() > 0.5 ? 1 : -1) : 0;
    this.flash     = new Map();
    this.hintPulse = 0;
    this.t = 0;
    this.fit();
  }
  xRange() {
    const lo = 8 - this.x0, hi = W - 8 - this.x1;
    return lo <= hi ? [lo, hi] : [(lo+hi)/2, (lo+hi)/2];
  }
  yRange() {
    const lo = hudH + 8 - this.y0;
    const hi = Math.max(lo, Math.min(H*0.56, GY - 90 - this.y1));
    return [lo, hi];
  }
  fit() {
    const [xl, xh] = this.xRange(), [yl, yh] = this.yRange();
    this.x = Math.max(xl, Math.min(xh, this.x));
    this.y = Math.max(yl, Math.min(yh, this.y));
  }
  ap(i) {
    const a = this.ld.atoms[i];
    return { x: this.x + a.rx, y: this.y + a.ry };
  }
  update() {
    this.t++;
    this.x += this.vx;
    const [xl, xh] = this.xRange();
    if (this.x < xl) { this.x = xl; this.vx =  Math.abs(this.vx); }
    else if (this.x > xh) { this.x = xh; this.vx = -Math.abs(this.vx); }
    if (this.ld.ymot) {
      this.y += this.vy;
      const [yl, yh] = this.yRange();
      if (this.y < yl) { this.y = yl; this.vy =  Math.abs(this.vy); }
      else if (this.y > yh) { this.y = yh; this.vy = -Math.abs(this.vy); }
    }
    this.flash.forEach((v, k) => { v.t--; if (v.t <= 0) this.flash.delete(k); });
    if (this.hintPulse > 0) this.hintPulse--;
  }
  draw() {
    const ld = this.ld;
    ld.bonds.forEach(b => {
      const p1 = this.ap(b.a), p2 = this.ap(b.b);
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len < 2) return;
      const ux = dx/len, uy = dy/len;
      g.strokeStyle = '#5577AA'; g.lineWidth = 2.2;
      if (b.t === 1) {
        g.beginPath();
        g.moveTo(p1.x + ux*AR, p1.y + uy*AR);
        g.lineTo(p2.x - ux*AR, p2.y - uy*AR);
        g.stroke();
      } else {
        const nx = -uy * 4.5, ny = ux * 4.5;
        for (const sg of [1, -1]) {
          g.beginPath();
          g.moveTo(p1.x + ux*AR + nx*sg, p1.y + uy*AR + ny*sg);
          g.lineTo(p2.x - ux*AR + nx*sg, p2.y - uy*AR + ny*sg);
          g.stroke();
        }
      }
    });
    ld.atoms.forEach((a, i) => {
      const pos = this.ap(i);
      const fl  = this.flash.get(i);
      const ec  = EC[a.s] || EC.H;
      let fill = ec.f, strk = ec.s, glow = null, blur = 0;
      if (fl) {
        fill = fl.ok ? '#00EE77' : '#DD1111';
        strk = fill; glow = fill; blur = 30;
      } else if (this.hintPulse > 0 && a.acidic) {
        glow = '#FFD700';
        blur = 10 + 14 * (this.hintPulse / 90);
      }
      if (glow) { g.shadowColor = glow; g.shadowBlur = blur; }
      g.beginPath(); g.arc(pos.x, pos.y, AR, 0, Math.PI*2);
      g.fillStyle = fill; g.fill();
      g.strokeStyle = strk; g.lineWidth = 2.2; g.stroke();
      g.shadowBlur = 0;
      const sym = a.s === 'Ha' ? 'H' : a.s;
      const fs  = sym.length > 2 ? 9 : sym.length > 1 ? 12 : 14;
      g.font = `bold ${fs}px monospace`;
      g.fillStyle = fl ? '#000' : ec.t;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(sym, pos.x, pos.y);
    });
    if (ld.charge) {
      const topA = ld.atoms.reduce((best, a) => a.ry < best.ry ? a : best);
      g.font = 'bold 15px monospace'; g.fillStyle = '#FFD700';
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillText(ld.charge, this.x + topA.rx + 20, this.y + topA.ry - 14);
    }
    const topY = Math.min(...ld.atoms.map(a => a.ry));
    g.font = F(13, true);
    g.fillStyle = ld.col + 'BB';
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillText(ld.name, this.x, this.y + topY - 28);
  }
}

/* ═══════════════════════════════════════════════════════════
   BULLET / PARTICLE / FLOATING TEXT
   ═══════════════════════════════════════════════════════════ */
class Bullet {
  constructor(x, y, vx, vy) { this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.alive=true; this.trail=[]; }
  update() {
    this.trail.unshift({x:this.x,y:this.y});
    if (this.trail.length > 10) this.trail.pop();
    this.x += this.vx; this.y += this.vy;
    if (this.x<-20||this.x>W+20||this.y<-20||this.y>H+20) this.alive=false;
  }
  draw() {
    this.trail.forEach((p,i) => {
      const f=(this.trail.length-i)/this.trail.length;
      g.beginPath(); g.arc(p.x,p.y,4.5*f,0,Math.PI*2);
      g.fillStyle=`rgba(255,200,50,${f*0.5})`; g.fill();
    });
    g.shadowColor='#FFDD00'; g.shadowBlur=16;
    g.beginPath(); g.arc(this.x,this.y,5.5,0,Math.PI*2);
    g.fillStyle='#FFE040'; g.fill();
    g.shadowBlur=0;
  }
}
class Particle {
  constructor(x,y,col) {
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*12; this.vy=(Math.random()-0.5)*12-2;
    this.life=1; this.decay=0.014+Math.random()*0.028;
    this.r=2.5+Math.random()*5; this.col=col;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.2; this.life-=this.decay; }
  draw(){
    const h=Math.max(0,Math.floor(this.life*255)).toString(16).padStart(2,'0');
    g.beginPath(); g.arc(this.x,this.y,Math.max(0,this.r*this.life),0,Math.PI*2);
    g.fillStyle=this.col+h; g.fill();
  }
}
function burst(n,x,y,col){ for(let i=0;i<n;i++) particles.push(new Particle(x,y,col)); }
class FTxt {
  constructor(x,y,txt,col,sz=20){ this.x=x;this.y=y;this.txt=txt;this.col=col;this.sz=sz;this.life=1;this.vy=-1.8; }
  update(){ this.y+=this.vy; this.life-=0.016; }
  draw(){
    const h=Math.max(0,Math.floor(this.life*255)).toString(16).padStart(2,'0');
    fitFont(this.txt, this.sz, W-20, true);
    g.fillStyle=this.col+h;
    g.textAlign='center'; g.textBaseline='alphabetic';
    const x=Math.max(60, Math.min(W-60, this.x));
    g.fillText(this.txt,x,this.y);
  }
}

/* ═══════════════════════════════════════════════════════════
   HIT DETECTION
   ═══════════════════════════════════════════════════════════ */
function checkHits() {
  bullets.forEach(b => {
    if (!b.alive || gs !== 'playing') return;
    mol.ld.atoms.forEach((atom, i) => {
      if (!b.alive || gs !== 'playing') return;
      const p = mol.ap(i);
      const dx = b.x-p.x, dy = b.y-p.y;
      if (dx*dx+dy*dy < (AR+8)*(AR+8)) {
        b.alive = false;
        if (atom.s !== 'H' && atom.s !== 'Ha') {
          burst(7,p.x,p.y,'#FFAA33');
          floats.push(new FTxt(p.x,p.y-40,'Not H!','#FFAA33',16));
        } else if (atom.acidic) {
          mol.flash.set(i,{t:60,ok:true});
          burst(50,p.x,p.y,'#00FF88');
          burst(25,p.x,p.y,'#FFFFFF');
          const elap   = (performance.now()-lvlStartT)/1000;
          const tBonus = Math.max(0, Math.round(150 - elap*2.2));
          const pts    = 100 + tBonus;
          score += pts; lastPts = pts;
          floats.push(new FTxt(p.x,p.y-52,`+${pts}`,'#44FF88',22));
          floats.push(new FTxt(W/2,H*0.62,`${mol.ld.name}  −H⁺→  ${mol.ld.cb}`,'#CCFFEE',17));
          gs = 'levdone'; levDoneT = performance.now();
        } else {
          mol.flash.set(i,{t:50,ok:false});
          burst(22,p.x,p.y,'#FF2222');
          mol.hintPulse = 90;
          floats.push(new FTxt(p.x,p.y-52,'Wrong H!','#FF4444',20));
          floats.push(new FTxt(p.x,p.y-30,`−1 Life`,'#FF8888',14));
          if (lives > 0) lives--;
          if (lives === 0) {
            gs = 'levdone'; levDoneT = performance.now();
            setTimeout(() => { if (gs==='levdone') gs='gameover'; }, 1100);
          }
        }
      }
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   DRAWING HELPERS
   ═══════════════════════════════════════════════════════════ */
function rrect(x,y,w,h,r) {
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y);
  g.arcTo(x+w,y,x+w,y+r,r); g.lineTo(x+w,y+h-r);
  g.arcTo(x+w,y+h,x+w-r,y+h,r); g.lineTo(x+r,y+h);
  g.arcTo(x,y+h,x,y+h-r,r); g.lineTo(x,y+r);
  g.arcTo(x,y,x+r,y,r); g.closePath();
}
function wrapLines(txt,maxW,fnt) {
  g.font=fnt;
  const words=txt.split(' '); const lines=[]; let cur='';
  words.forEach(w => {
    const t=cur?cur+' '+w:w;
    if (g.measureText(t).width>maxW&&cur) { lines.push(cur); cur=w; }
    else cur=t;
  });
  if (cur) lines.push(cur);
  return lines;
}
function drawBg() {
  g.fillStyle=BG; g.fillRect(0,0,W,H);
  const nb=g.createRadialGradient(W*0.22,H*0.25,30,W*0.22,H*0.25,320);
  nb.addColorStop(0,'rgba(12,28,75,0.10)'); nb.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=nb; g.fillRect(0,0,W,H);
  const t=Date.now()*0.0009;
  STARS.forEach(s => {
    const a=0.22+0.28*Math.sin(t+s.ph);
    g.beginPath(); g.arc(s.x,s.y,s.r,0,Math.PI*2);
    g.fillStyle=`rgba(255,255,255,${a})`; g.fill();
  });
}
function gunTip() {
  return { x:GX+Math.cos(gunAngle)*(BARREL+24), y:GY+Math.sin(gunAngle)*(BARREL+24) };
}
function drawAimLine() {
  const tip=gunTip();
  g.save();
  g.strokeStyle='rgba(80,130,200,0.14)';
  g.lineWidth=1.5; g.setLineDash([5,10]);
  g.beginPath(); g.moveTo(tip.x,tip.y);
  g.lineTo(tip.x+Math.cos(gunAngle)*2400, tip.y+Math.sin(gunAngle)*2400);
  g.stroke(); g.setLineDash([]); g.restore();
}
function drawGun() {
  g.save(); g.translate(GX,GY);
  g.beginPath(); g.arc(0,0,30,0,Math.PI*2);
  g.fillStyle='#07182e'; g.fill();
  g.strokeStyle='#1e4870'; g.lineWidth=2.5; g.stroke();
  for (let i=1;i<=2;i++){
    g.beginPath(); g.arc(0,0,8+i*9,0,Math.PI*2);
    g.strokeStyle=`rgba(50,110,180,${0.35-i*0.08})`; g.lineWidth=1; g.stroke();
  }
  g.rotate(gunAngle);
  g.fillStyle=gunFlash>0?'#FFDD44':'#122840';
  rrect(20,-7,BARREL,14,3); g.fill();
  g.fillStyle='#1e4878'; rrect(20,-7,14,14,3); g.fill();
  g.fillStyle='#5a9acc'; rrect(BARREL+20-6,-5,14,10,2); g.fill();
  if (gunFlash>0){
    const af=gunFlash/8;
    g.shadowColor='#FFE000'; g.shadowBlur=22;
    g.beginPath(); g.arc(BARREL+28,0,13*af,0,Math.PI*2);
    g.fillStyle=`rgba(255,225,50,${af})`; g.fill();
    g.shadowBlur=0;
  }
  g.restore();
  if (gunFlash>0) gunFlash--;
}
function drawCrosshair() {
  const sz=13, gap=5;
  g.strokeStyle='rgba(160,210,255,0.70)'; g.lineWidth=1.5;
  g.beginPath();
  g.moveTo(mx-sz,my); g.lineTo(mx-gap,my);
  g.moveTo(mx+gap,my); g.lineTo(mx+sz,my);
  g.moveTo(mx,my-sz); g.lineTo(mx,my-gap);
  g.moveTo(mx,my+gap); g.lineTo(mx,my+sz);
  g.stroke();
  g.beginPath(); g.arc(mx,my,2.5,0,Math.PI*2);
  g.fillStyle='rgba(160,210,255,0.55)'; g.fill();
}

/* flow layout for the "correct" panel so nothing overflows */
function panelLayout(ld,PW,fs){
  const lh=Math.round(fs*1.45), rfs=fs-1, rlh=Math.round(rfs*1.5);
  const bullets=ld.exp.map(l=>wrapLines(l,PW-56-18,F(fs)));
  const bH=bullets.reduce((s,w)=>s+w.length*lh+5,0);
  const rel=wrapLines(ld.rel,PW-40,F(rfs));
  const PH=200+bH-lh+9+28+(rel.length-1)*rlh+20+36+16;
  return {PH,bullets,rel,lh,rfs,rlh};
}

function drawLevelDone() {
  if (mol) { mol.update(); mol.draw(); }
  particles.forEach(p=>p.update()); particles=particles.filter(p=>p.life>0);
  floats.forEach(f=>f.update()); floats=floats.filter(f=>f.life>0);
  particles.forEach(p=>p.draw()); floats.forEach(f=>f.draw());
  drawGun();

  g.fillStyle='rgba(0,0,0,0.80)'; g.fillRect(0,0,W,H);
  const ld = LEVELS[Math.min(lvl, LEVELS.length-1)];

  if (lives <= 0) {
    const bw=Math.min(400,W-40), bh=160, bx=W/2-bw/2, by=H/2-80;

    g.fillText('Game Over incoming…',W/2,by+130);
    return;
  }

  const PW = Math.min(700, W-24);
  let fs=13, L=panelLayout(ld,PW,fs);

  fitFont(ld.name,22,boxW-12,true,'monospace'); g.fillStyle='#FF8888'; g.fillText(ld.name,aX+boxW/2,midY-10);

  const bulletX=PX+28;
  g.font=F(fs); g.textAlign='left';
  let bulletY=PY+200;
  L.bullets.forEach(wrapped=>{
    g.fillStyle='#FFDD44'; g.fillText('→',bulletX,bulletY);
    g.fillStyle='#AABBCC';
    wrapped.forEach((wl,wi)=>g.fillText(wl,bulletX+18,bulletY+wi*L.lh));
    bulletY+=wrapped.length*L.lh+5;
  });

  const sep2Y=bulletY-L.lh-5+14;
  g.strokeStyle='#1a3a2a'; g.lineWidth=1;
  g.beginPath(); g.moveTo(sx,sep2Y); g.lineTo(sx+sw,sep2Y); g.stroke();
  g.font=F(10,true); g.fillStyle='#2a5a3a'; g.textAlign='center';
  fitFont('CLINICAL / BIOCHEMICAL RELEVANCE',10,PW-40,true);
  g.fillText('CLINICAL / BIOCHEMICAL RELEVANCE',W/2,sep2Y+12);

  g.font=F(L.rfs); g.fillStyle='#88AABB'; g.textAlign='left';
  L.rel.forEach((l,i)=>g.fillText(l,PX+20,sep2Y+28+i*L.rlh));

  /* score badge + continue button */
  const btnW=Math.min(200,PW-160), btnH=36, btnX=W/2-btnW/2, btnY=PY+PH-52;
  g.font=F(14,true); g.fillStyle='#FFDD44'; g.textAlign='left'; g.textBaseline='middle';
  g.fillText(`+${lastPts} pts`,PX+20,btnY+btnH/2);
  const btnHov=inR(mx,my,{x:btnX,y:btnY,w:btnW,h:btnH});
  g.fillStyle=btnHov?'#0d3020':'#081a10'; rrect(btnX,btnY,btnW,btnH,8); g.fill();
  g.strokeStyle=btnHov?'#55EE99':'#33AA66'; g.lineWidth=1.5; rrect(btnX,btnY,btnW,btnH,8); g.stroke();
  const bt=lvl+1<LEVELS.length?'Continue  →':'See Results  →';
  fitFont(bt,14,btnW-12,true); g.fillStyle=btnHov?'#AAFFCC':'#66DD99';
  g.textAlign='center'; g.fillText(bt,W/2,btnY+btnH/2);
}

function drawGameOver() {
  drawBg();
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.shadowColor='#FF3333'; g.shadowBlur=34;
  fitFont('💀  GAME OVER',44,W-30,true); g.fillStyle='#FF4455';
  g.fillText('💀  GAME OVER',W/2,H*0.3); g.shadowBlur=0;
  const t=`Reached Level ${Math.min(lvl+1,LEVELS.length)}: ${LEVELS[Math.min(lvl,LEVELS.length-1)].full}`;
  fitFont(t,16,W-30); g.fillStyle='#8899AA'; g.fillText(t,W/2,H*0.3+44);
  g.font=F(22,true); g.fillStyle='#FFDD44';
  g.fillText(`Final Score: ${score}`,W/2,H*0.3+82);
  g.font=F(13); g.fillStyle='#3a5566';
  g.fillText('Conjugate pairs covered:',W/2,H*0.3+124);
  LEVELS.slice(0,lvl).forEach((l,i)=>{
    g.fillStyle='#5577AA';
    g.fillText(`${l.name}  −H⁺→  ${l.cb}`,W/2,H*0.3+144+i*20);
  });
  g.font=F(15,true); g.fillStyle='#4488AA';
  g.fillText(isTouch?'Tap anywhere to try again':'Click anywhere to try again',W/2,H*0.85);
}

function drawWin() {
  drawBg();
  g.textAlign='center'; g.textBaseline='alphabetic';
  g.shadowColor='#FFD700'; g.shadowBlur=36;
  fitFont('🏆  ALL LEVELS COMPLETE!',42,W-30,true); g.fillStyle='#FFD700';
  g.fillText('🏆  ALL LEVELS COMPLETE!',W/2,H*0.13); g.shadowBlur=0;
  g.font=F(15); g.fillStyle='#88FFAA';
  g.fillText('All 6 acid molecules neutralized!',W/2,H*0.13+36);
  g.font=F(24,true); g.fillStyle='#FFD700';
  g.fillText(`Final Score: ${score}`,W/2,H*0.13+74);
  g.font=F(12,true); g.fillStyle='#3a5566';
  g.fillText('─  Conjugate Pair Summary  ─',W/2,H*0.36);
  LEVELS.forEach((l,i)=>{
    const y=H*0.395+i*34;
    if (narrow) {
      const t=`${l.name}  −H⁺→  ${l.cb}   (${l.cbName})`;
      g.textAlign='center'; fitFont(t,14,W-30); g.fillStyle=l.col;
      g.fillText(t,W/2,y);
    } else {
      g.textAlign='right'; g.font='bold 15px monospace'; g.fillStyle=l.col;
      g.fillText(l.name,W/2-8,y);
      g.textAlign='left'; g.font=F(13); g.fillStyle='#BBCCDD';
      g.fillText(`  −H⁺→  ${l.cb}   (${l.cbName})`,W/2+8,y);
    }
  });
  g.textAlign='center'; g.font=F(15,true); g.fillStyle='#44BB77';
  g.fillText(isTouch?'Tap anywhere to play again':'Click anywhere to play again',W/2,H*0.94);
}

/* ═══════════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════════ */
function loop() {
  requestAnimationFrame(loop);
  if (gs==='start')    { drawStart();    if(!isTouch) drawCrosshair(); return; }
  if (gs==='intro')    { drawIntro();    if(!isTouch) drawCrosshair(); return; }
  if (gs==='gameover') { drawGameOver(); if(!isTouch) drawCrosshair(); return; }
  if (gs==='win')      { drawWin();      if(!isTouch) drawCrosshair(); return; }
  if (gs==='levdone')  { drawBg(); drawAimLine(); drawLevelDone(); if(!isTouch) drawCrosshair(); return; }

  drawBg();
  drawAimLine();
  mol.update();
  bullets.forEach(b=>b.update()); bullets=bullets.filter(b=>b.alive);
  particles.forEach(p=>p.update()); particles=particles.filter(p=>p.life>0);
  floats.forEach(f=>f.update()); floats=floats.filter(f=>f.life>0);
  checkHits();
  particles.forEach(p=>p.draw());
  mol.draw();
  bullets.forEach(b=>b.draw());
  floats.forEach(f=>f.draw());
  gunAngle=Math.atan2(my-GY,mx-GX);
  drawGun(); drawHUD(); drawHintBox(); drawCrosshair();
}

/* ═══════════════════════════════════════════════════════════
   INPUT — pointer events work for mouse, touch and pen
   ═══════════════════════════════════════════════════════════ */
function setPtr(e) {
  const r=cv.getBoundingClientRect();
  mx=(e.clientX-r.left)*(W/r.width);
  my=(e.clientY-r.top)*(H/r.height);
}
function tap(x,y) {
  if (gs==='start') { if (inR(x,y,window._SB)) gs='intro'; return; }
  if (gs==='intro') {
    mol=new Mol(LEVELS[lvl]);
    bullets=[]; particles=[]; floats=[]; hintOn=false;
    lvlStartT=performance.now();
    gs='playing'; return;
  }
  if (gs==='levdone') {
    /* short delay so a fast double-tap doesn't skip the explanation */
    if (lives>0 && performance.now()-levDoneT>700) {
      lvl++; gs = lvl>=LEVELS.length ? 'win' : 'intro';
    }
    return;
  }
  if (gs==='gameover'||gs==='win') { lvl=0; lives=3; score=0; lastPts=0; mol=null; gs='start'; return; }
  if (gs==='playing') {
    const hb=hintBtn();
    if (inR(x,y,{x:hb.x-8,y:hb.y-8,w:hb.w+16,h:hb.h+16})) { hintOn=!hintOn; return; }
    gunAngle=Math.atan2(y-GY,x-GX);   // aim at the tap point before firing
    const tip=gunTip();
    bullets.push(new Bullet(tip.x,tip.y,Math.cos(gunAngle)*BSPD,Math.sin(gunAngle)*BSPD));
    gunFlash=8;
  }
}
cv.addEventListener('pointermove', e => setPtr(e));
cv.addEventListener('pointerdown', e => { e.preventDefault(); setPtr(e); tap(mx,my); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('touchend',  e => e.preventDefault(), {passive:false});  // stops iOS double-tap zoom
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('keydown', e => { if (e.key.toLowerCase()==='h') hintOn=!hintOn; });

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

resize();
loop();
</script>
